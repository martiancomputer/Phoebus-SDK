start       10.1.0.100
end         10.1.0.171
interface   br0
lease_file  /var/lib/misc/udhcpd.leases
option subnet 255.255.255.0
option router 10.1.0.1
option dns    10.1.0.1
option lease  86400

# Leave .172 and higher outside DHCP for statically addressed infrastructure.
# Pool is .100-.171 = 72 addresses; state it so udhcpd does not warn
# about clamping its 235 default down to the range size.
max_leases  72
