start       192.168.1.100
end         192.168.1.200
interface   br0
lease_file  /var/lib/misc/udhcpd.leases
option subnet 255.255.255.0
option router 192.168.1.1
option dns    192.168.1.1
option lease  86400

# Pool is .100-.200 = 101 addresses; state it so udhcpd does not warn
# about clamping its 235 default down to the range size.
max_leases  101
