# Phoebus-OS AP -- RTL8832BR (5 GHz, band_cap:5G)
interface=wlan0
driver=nl80211
bridge=br0
ctrl_interface=/var/run/hostapd

ssid=Phoebus5
country_code=US
hw_mode=a
channel=36
ieee80211d=1

wmm_enabled=1
ieee80211n=1
ht_capab=[SHORT-GI-20][SHORT-GI-40]
ieee80211ac=1
vht_oper_chwidth=0

# --- WPA2/WPA3 transition: WPA2-PSK (legacy) + WPA3-SAE ---
# ieee80211w=1 keeps PMF optional so pre-WPA3 clients still associate, while SAE
# clients get mandatory PMF (sae_require_mfp=1). If the RTL8832BR can't do SAE/PMF
# on-air, clients simply negotiate WPA2-PSK -- no lockout.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1
# PLACEHOLDER -- replaced at build time from secrets/phoebus.env (see PROVISIONING.md).
# Do NOT ship this default; it is public.
wpa_passphrase=ChangeMe-Phoebus-Default
