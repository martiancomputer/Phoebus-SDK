# Phoebus-OS AP -- RTL8832BR (5 GHz, band_cap:5G)
interface=wlan0
driver=nl80211
bridge=br0
ctrl_interface=/var/run/hostapd

ssid=Phoebus5
country_code=US
hw_mode=a
channel=149
ieee80211d=1

wmm_enabled=1

# Deliberately NO beacon_int / dtim_period here.
#
# This is wlan0, driven by rtk_wifi6 -- a different driver from wlan1's
# rtl8192cd. The analysis that motivated setting them (the MBSSID block in
# 8192cd_osdep.c raising the minimum beacon interval once unused VAPs are open)
# is rtl8192cd code, and every VAP on this board is a wlan1-* device. None of it
# applies to this radio.
#
# Setting them here anyway regressed 5GHz badly: PCs could not associate at all
# while phones still could, and downstream collapsed to ~2Mbit while upstream
# stayed near line rate -- i.e. the AP transmit path. Reverted to hostapd
# defaults, which is what this radio ran on for every working build before it.
#
# If 5GHz power-save latency ever needs tuning, measure rtk_wifi6 first. Do not
# carry conclusions across from the 2.4GHz driver.
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
ieee80211ac=1

# 802.11ax. Everything below this line already supported it and nothing asked:
#
#   autoconf_rtl8832br_pci_linux.h:53   #define CONFIG_80211AX_HE   (our chip;
#                                       the vendor leaves it commented out on
#                                       the 8852b variants, enabled on ours)
#   ioctl_cfg80211.c                    has_he = 1, n_iftype_data = 2, HE
#                                       MAC/PHY caps filled in
#   hostapd                             built CONFIG_IEEE80211AX=y
#
# Without this line hostapd brings the BSS up as VHT and the AX10 -- a WiFi 6
# router -- serves 802.11ac. WPA3/SAE worked throughout; that is orthogonal.
#
# 2.4GHz is deliberately NOT given this: wlan1 is rtl8192cd, a different driver,
# and this model's 2.4GHz radio is 300Mbit 11n. See
# [[phoebus-wifi-two-drivers]] before assuming anything carries across.
#
# If hostapd refuses to start, it will say so on the console and 5GHz simply
# will not appear -- revert this one line rather than adding he_* parameters to
# chase it.
ieee80211ax=1

# 80MHz on the 149 block. Two separate findings live here.
#
# Width: the driver reported bwmode=0 / "bw=0", i.e. 20MHz, which caps this
# radio near 86Mbit whatever else is fixed.
#
# Channel: 36 was a bad default in this location. A scan found six BSSes inside
# the 36/40/44/48 block including the two loudest APs in the neighbourhood
# (Airtel_Home at 31/100 on ch36, Airtel_VishnuVJ at 29/100 on ch48). Moving to
# 149 cut AP->client latency from 39ms avg / 340ms max to 13ms / 46ms and raised
# peak downstream about fivefold. Stock also picks 149.
#
# This is a starting point, not a fixed answer -- wifi-acs re-evaluates it every
# 30 minutes and will move the BSS by CSA if the neighbourhood changes. See
# /etc/wifi-acs.conf.
#
# Four settings, not one -- width alone is not enough and hostapd refuses to
# start without the rest:
#   ht_capab [HT40+]   declares the 40MHz secondary ABOVE the control channel
#   *_chwidth=1        80MHz
#   *_centr_freq_seg0  block 149/153/157/161 has its centre at ch155
# he_* mirrors vht_* because the BSS is 802.11ax; setting only the vht_ pair
# leaves HE operating at 20MHz while VHT claims 80.
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=155
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=155

# --- WPA2/WPA3 transition: WPA2-PSK (legacy) + WPA3-SAE ---
# ieee80211w=1 keeps PMF optional so pre-WPA3 clients still associate, while SAE
# clients get mandatory PMF (sae_require_mfp=1). If the RTL8832BR can't do SAE/PMF
# on-air, clients simply negotiate WPA2-PSK -- no lockout.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1

# SAE Hash-to-Element. Without this, hostapd derives the PWE by hunting-and-
# pecking -- up to 40 rounds of EC point derivation per association, which the
# log shows plainly ("SAE: counter = 001" ... "counter = 040", then "H2E=0").
# On this 900MHz MIPS with no crypto accelerator that is slow enough that Android
# gives up on its first auth attempt and only succeeds on the retry, once the
# PMKSA is cached; more patient clients connect first time. H2E replaces the
# search loop with a single deterministic derivation.
# 2 = accept both H2E and hunting-and-pecking, so pre-H2E clients still work.
sae_pwe=2
# PLACEHOLDER -- replaced at build time from secrets/phoebus.env (see PROVISIONING.md).
# Do NOT ship this default; it is public.
wpa_passphrase=ChangeMe-Phoebus-Default
