# DNS forwarder for Phoebus-OS. DHCP is left to udhcpd.
#
# Why this exists: udhcpd hands LAN clients "option dns 192.168.1.1", i.e. the
# router itself, but nothing was listening on port 53. Clients could not resolve
# anything -- and with the ISP running a captive portal, they could not even be
# redirected to the sign-in page, because that redirect arrives via DNS.

# LAN side only. bind-interfaces makes dnsmasq bind br0/lo specifically instead
# of listening on 0.0.0.0, so the resolver is never reachable from the WAN --
# an open resolver on a public address gets abused for amplification.
interface=br0
bind-interfaces
port=53

# There is deliberately no except-interface= line. It used to name eth0.8, which
# was both redundant and a trap: interface=br0 with bind-interfaces already binds
# br0 and lo and nothing else. The moment the WAN moved to another netdev, that
# hardcoded name silently described the wrong interface while still reading like
# a deliberate safety measure. Whichever netdev wan= picks, dnsmasq never binds
# it.

# dnsmasq does DNS here, nothing else. udhcpd already serves DHCP on br0 and two
# DHCP servers on one segment would fight over the same clients.
no-dhcp-interface=br0

# Upstream = whatever the WAN lease gave us. The udhcpc callback rewrites
# /etc/resolv.conf on every lease, and dnsmasq re-reads it when it changes.
resolv-file=/etc/resolv.conf

# Drop privileges after binding port 53. dnsmasq defaults to user "nobody",
# which did not exist in this rootfs -- it exited with "unknown user or group:
# nobody" on every start and s6 restarted it in a loop. Fixed by adding
# nobody:65534/nogroup:65534 to /etc/passwd and /etc/group rather than running
# it as root, which is the other way to silence that error and the wrong one:
# this daemon parses untrusted DNS responses off the WAN.
user=nobody
group=nogroup

# Do not forward queries that cannot be answered upstream anyway.
domain-needed
bogus-priv

cache-size=1000
