# Phoebus-OS AP -- RTL8192F (2.4 GHz, band_cap:2G)
interface=wlan1
driver=nl80211
bridge=br0
ctrl_interface=/var/run/hostapd

ssid=Phoebus2.4
country_code=US
hw_mode=g
channel=6
ieee80211d=1

wmm_enabled=1
ieee80211n=1
ht_capab=[SHORT-GI-20][SHORT-GI-40]

# The driver-side override that made this not take effect has been tracked down.
#
# rtl8192cd does assign hostapd's value (8192cd_cfg80211.c, dot11BeaconPeriod =
# info->beacon_interval) and then raises it again in the MBSSID block of
# 8192cd_osdep.c, which counts VAPs with IS_DRV_OPEN() set:
#
#   ssid_num >= 8 (PCIe) -> 400 TU     ssid_num >= 5 -> 200 TU     else 100 TU
#
# network-up used to bring up every interface in /sys/class/net, including all
# nine wlanN-vap* devices, so ssid_num hit 8 and the beacon was forced to 400 TU
# -- exactly the value clients reported off the air. The config was never wrong.
# network-up now leaves the spare VAP/WDS/vxd devices down; do not re-add them
# to that loop without re-measuring the beacon interval.
#
# dtim_period stays at 2, hostapd's default. With the beacon back at 100 TU that
# is ~200ms between DTIMs instead of ~820ms, which is the whole win. Setting it
# to 1 was speculative tuning on top and is not worth the risk: the same change
# applied to the 5GHz radio (a different driver) stopped PCs associating at all.
#
# Measured before the fix: 15% ICMP loss and 8ms latency spikes from a laptop at
# -34dBm on MCS15, plus SSH sessions that would not establish while HTTP and
# video were unaffected -- continuous traffic keeps a client awake, an idle
# interactive session does not.
beacon_int=100
dtim_period=2

# --- WPA2/WPA3 transition: WPA2-PSK (legacy) + WPA3-SAE ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1
# PLACEHOLDER -- replaced at build time from secrets/phoebus.env (see PROVISIONING.md).
# Do NOT ship this default; it is public.
wpa_passphrase=ChangeMe-Phoebus-Default
