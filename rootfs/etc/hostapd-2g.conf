# Phoebus-OS AP -- RTL8192F (2.4 GHz, band_cap:2G)
interface=wlan1
driver=nl80211
bridge=br0
ctrl_interface=/var/run/hostapd

ssid=Phoebus2.4
country_code=US
hw_mode=g
channel=6
ieee80211d=1

wmm_enabled=1
ieee80211n=1
ht_capab=[SHORT-GI-20][SHORT-GI-40]

# Stated explicitly, but be aware it does NOT currently take effect: rtl8192cd
# overrides it somewhere downstream of realtek_set_beacon(), which does assign
# hostapd's value (8192cd_cfg80211.c, dot11BeaconPeriod = info->beacon_interval).
# hostapd_cli reports beacon_int=100 on both radios while a client on the same
# link reports "beacon int: 400" off the air. With dtim_period 2 that is ~820ms
# between DTIM beacons, and a client in power save only wakes for DTIM -- 15%
# ICMP loss and 8ms latency spikes measured from a laptop at -34dBm on MCS15.
#
# 100/2 is what hostapd would default to anyway, so these two lines change
# nothing today. Left in as documentation of intent, and so they start working
# if the driver-side override is ever tracked down. Do not treat the 400 TU
# beacon as fixed.
beacon_int=100
dtim_period=2

# --- WPA2/WPA3 transition: WPA2-PSK (legacy) + WPA3-SAE ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1
# PLACEHOLDER -- replaced at build time from secrets/phoebus.env (see PROVISIONING.md).
# Do NOT ship this default; it is public.
wpa_passphrase=ChangeMe-Phoebus-Default
