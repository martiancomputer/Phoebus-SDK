# Automatic channel selection for the 5GHz radio.
#
# Why this exists: the radio was left on channel 36, which here sits under the
# two loudest APs in the neighbourhood -- six BSSes inside our 80MHz block
# (36/40/44/48). Moving to 149 cut AP->client latency from 39ms/340ms avg/max to
# 13ms/46ms and raised peak downstream about fivefold. Stock picks 149 too.
# A fixed channel is a guess about someone else's radio environment.

ACS_ENABLE=1

# How often to consider a change. Scanning briefly takes the radio off-channel,
# so this is deliberately slow -- congestion is a property of the neighbourhood,
# not of the minute.
ACS_INTERVAL=1800

# --- guard conditions: never switch while the network is in use ---------------
#
# A channel switch is more disruptive than a congested channel. Both of these
# must be satisfied or the cycle is skipped entirely (including the scan).

# (a) no data flowing. Measured as wlan0 tx+rx bytes over ACS_IDLE_SAMPLE
#     seconds; above this many KB/s the radio is considered busy.
ACS_IDLE_KBPS=32
ACS_IDLE_SAMPLE=3

# (b) no client awake. A station with sleep=no is actively using the link;
#     switching under it is exactly what we are trying to avoid. Stations that
#     are asleep will follow the CSA when they next wake.
ACS_REQUIRE_ALL_ASLEEP=1

# --- hysteresis --------------------------------------------------------------
# Only move if the candidate scores this much better than where we are. Without
# it the radio ping-pongs between two near-equal channels every interval, which
# is worse than either.
ACS_MIN_IMPROVEMENT=25

# Candidate 80MHz blocks, non-DFS only: "<control>:<centre-idx>:<centre-MHz>".
# DFS blocks (52-64, 100-144) are excluded on purpose -- they require radar
# detection and a 60s channel-availability check before use, which is a much
# bigger change than this.
ACS_CANDIDATES="36:42:5210 149:155:5775"
