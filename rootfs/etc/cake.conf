# CAKE shaper settings for the WAN. Sourced by /etc/s6/scripts/cake-up.
#
# This is the reason the project exists: stock has no QoS worth the name, and
# bufferbloat on this line showed up as 300-400ms latency under load.
#
# --- bandwidth ---------------------------------------------------------------
# CAKE only controls the queue if IT is the bottleneck, so both figures must sit
# slightly BELOW what the link actually achieves. Set them too high and the real
# queue stays in the ISP's equipment where we cannot touch it, and the shaper
# does nothing at all.
#
# Measured on this line: 93.22 Mbit down / 94.04 Mbit up on a 100/100 plan.
# 92 Mbit each way is ~1-2% under that, which is the usual starting point.
# If latency under load is still poor, come DOWN in 5% steps -- do not go up.
#
# Set to 0 to disable that direction entirely.
CAKE_DOWN_KBIT=92000
CAKE_UP_KBIT=92000

# --- link layer --------------------------------------------------------------
# Ethernet handoff to the ISP, so 18 bytes of framing overhead (14 header + 4
# FCS). If this ever moves behind PPPoE add 8, or use one of tc's keywords
# (docsis, pppoe-ptm, ...) instead.
CAKE_OVERHEAD="ethernet"

# --- fairness ----------------------------------------------------------------
# dual-srchost on egress / dual-dsthost on ingress gives per-internal-host
# fairness first, then per-flow within each host -- so one machine running a
# torrent cannot drown the rest of the house.
#
# "nat" is REQUIRED here and easy to miss: we masquerade, so by the time CAKE
# sees an ingress packet its destination is already the WAN address and every
# flow looks like the same host. Without it the host-fairness half is silently
# a no-op. It makes CAKE do the conntrack lookup to recover the real LAN IP.
CAKE_EGRESS_OPTS="diffserv4 dual-srchost nat ack-filter"
CAKE_INGRESS_OPTS="diffserv4 dual-dsthost nat ingress"
