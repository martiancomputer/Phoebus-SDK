# LED effects only. Wiring and trusted producers are compiled into gpio-daemon.
[general]
brightness = 255
restore_on_reload = true

[power]
on_boot = blink
on_system_ready = solid
on_shutdown = off
blink_on_ms = 250
blink_off_ms = 250

[lan]
on_all_disconnected = off
on_link_up = pulse
on_link_down = solid_if_connected
on_dhcp_ack = flash
pulse_count = port_number
pulse_on_ms = 125
pulse_off_ms = 125

[internet]
on_no_carrier = off
on_carrier_detected = blink_orange
on_dhcp_bound = solid_orange
on_internet_online = solid_green
on_internet_lost = blink_orange
blink_on_ms = 400
blink_off_ms = 400

[wifi_2g]
on_starting = blink
on_ready = solid
on_stopped = off
on_failed = blink_fast

[wifi_5g]
on_starting = blink
on_ready = solid
on_stopped = off
on_failed = blink_fast

[vpn]
on_connected = solid
on_disconnected = off
on_connecting = blink
